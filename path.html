<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Board</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* The board is a grid: 7 columns across, 3 rows down */
        .board {
            display: grid;
            grid-template-columns: repeat(7, 100px);
            grid-template-rows: repeat(3, 100px);
            border: 3px solid black;
            padding: 30px;
            background-color: #ff99ff; /* Matches the pink start page */
        }

        .tile {
            border: 2px solid black;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
        }

        .start, .end {
            color: #e0201b;
            font-size: 1.2em;
            background-color: #ffe8cc;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="board">
        <!-- Bottom row: START, then left to right -->
        <div class="tile start" style="grid-row: 3; grid-column: 1;">🌽<br>START</div>
        <div class="tile" style="grid-row: 3; grid-column: 2;">1</div>
        <div class="tile" style="grid-row: 3; grid-column: 3;">2</div>
        <div class="tile" style="grid-row: 3; grid-column: 4;">3</div>
        <div class="tile" style="grid-row: 3; grid-column: 5;">4</div>
        <div class="tile" style="grid-row: 3; grid-column: 6;">5</div>
        <div class="tile" style="grid-row: 3; grid-column: 7;">6</div>

        <!-- Right side: going up -->
        <div class="tile" style="grid-row: 2; grid-column: 7;">7</div>

        <!-- Top row: right to left, then END -->
        <div class="tile" style="grid-row: 1; grid-column: 7;">8</div>
        <div class="tile" style="grid-row: 1; grid-column: 6;">9</div>
        <div class="tile" style="grid-row: 1; grid-column: 5;">10</div>
        <div class="tile" style="grid-row: 1; grid-column: 4;">11</div>
        <div class="tile" style="grid-row: 1; grid-column: 3;">12</div>
        <div class="tile" style="grid-row: 1; grid-column: 2;">13</div>
        <div class="tile end" style="grid-row: 1; grid-column: 1;">🍁<br>END</div>
    </div>
</body>
</html>

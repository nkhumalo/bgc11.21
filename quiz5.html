    <div class="quiz-block">
        <h1 class="question">
            <span class="question-number">Question 5 of 5</span>
            What is supervised learning?
        </h1>

        <button class="answer"><span class="box"></span>When a teacher watches a student while they take a test</button>
        <button class="answer"><span class="box"></span>When an AI learns completely on its own without any examples</button>
        <button class="answer" data-correct="true"><span class="box"></span>Training an AI with examples that already have the right answers (labels), so it can label new examples</button>
        <button class="answer"><span class="box"></span>When a person types every answer for the AI to repeat word for word</button>

        <p class="feedback" id="feedback"></p>
        <p class="explain" id="explain" hidden>In the next challenges, your team will use supervised learning! Each sentence you write is an example, and your name is the label. The AI studies the labeled examples, then tries to guess who wrote brand new sentences.</p>

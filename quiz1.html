<body data-level="1" class="theme-pink">
    <div class="quiz-block">
        <h1 class="question">
            <span class="question-number">Question 1 of 5</span>
            What is (AI) Artificial Intelligence?
        </h1>

        <button class="answer"><span class="box"></span>A robot that is alive and has feelings just like a person</button>
        <button class="answer" data-correct="true"><span class="box"></span>An object that is not alive that can perform tasks that, for humans, require thinking</button>
        <button class="answer"><span class="box"></span>A person who is really, really good at math</button>
        <button class="answer"><span class="box"></span>A type of website where you can only watch videos</button>

        <p class="feedback" id="feedback"></p>
        <p class="explain" id="explain" hidden>AI isn't alive and doesn't have feelings. It's a computer program that does things like recognizing faces, translating languages, or writing text, which are tasks that take thinking when humans do them.</p>

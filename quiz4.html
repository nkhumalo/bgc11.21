<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Quiz 4: Token</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="game.css">

<body data-level="5" class="theme-purple">
    <div class="quiz-block">
        <h1 class="question">
            <span class="question-number">Question 4 of 5</span>
            In AI, what is a token?
        </h1>

        <button class="answer"><span class="box"></span>A coin you use to play games at an arcade</button>
        <button class="answer" data-correct="true"><span class="box"></span>A small piece of text, like a word or part of a word, that an AI turns into a number to work with</button>
        <button class="answer"><span class="box"></span>A whole paragraph that the AI memorizes word for word</button>
        <button class="answer"><span class="box"></span>A reward the AI gets every time it answers correctly</button>

        <p class="feedback" id="feedback"></p>
        <p class="explain" id="explain" hidden>Chatbots chop your message into tokens before doing anything with it. A token might be a whole word like "pie" or a piece of a word, like "chat" + "bots." Each token gets its own ID number.</p>

        <a class="back-button" href="path.html">← Back to Board</a>
    </div>
